spring.application.name=skyline
# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# --- Base de datos H2 (en memoria) ---
spring.datasource.url=jdbc:h2:mem:skylinedb
spring.datasource.username=sa
spring.datasource.password=


# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false


# --- Consola web de H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# --- Seguridad / JWT ---
# Development secret only (HS256 needs at least 32 bytes). Never use this one in production.
jwt.secret=skyline-clave-secreta-de-desarrollo-minimo-32-bytes-2026
# Token lifetime in minutes
jwt.expiry=60
